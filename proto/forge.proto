syntax = "proto3";

package forgepb;

option go_package = "github.com/ronavpoonekar/forge/proto/forgepb";

// To regenerate Go code after modifying this file, run from the forge/ directory:
//   protoc --go_out=proto/forgepb --go-grpc_out=proto/forgepb \
//     --go_opt=paths=source_relative --go-grpc_opt=paths=source_relative \
//     --proto_path=proto proto/forge.proto

service ForgeService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);

  // Stage 5: NEW — workers call this every few seconds to say "I'm alive"
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// --- RegisterWorker ---
message RegisterWorkerRequest { string worker_id = 1; }
message RegisterWorkerResponse { bool ok = 1; }

// --- GetTask ---
message GetTaskRequest { string worker_id = 1; }
message GetTaskResponse {
  bool has_task = 1;
  string task_id = 2;
  string command = 3;
}

// --- ReportResult ---
message ReportResultRequest {
  string worker_id = 1;
  string task_id = 2;
  string output = 3;
  int32 exit_code = 4;
}
message ReportResultResponse { bool ok = 1; }

// --- Heartbeat (Stage 5: NEW) ---
message HeartbeatRequest {
  string worker_id = 1;
}
message HeartbeatResponse {
  bool ok = 1;
}
