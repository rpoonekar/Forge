syntax = "proto3";

package forgepb;

option go_package = "github.com/ronavpoonekar/forge/proto/forgepb";

// To regenerate Go code after modifying this file, run from the forge/ directory:
//   protoc --go_out=proto/forgepb --go-grpc_out=proto/forgepb \
//     --go_opt=paths=source_relative --go-grpc_opt=paths=source_relative \
//     --proto_path=proto proto/forge.proto

service ForgeService {
  // RegisterWorker is called once when a worker starts up.
  // The scheduler records the worker in its registry.
  // Stage 3: NEW RPC
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);

  // GetTask is called by a worker to request a task to execute.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);

  // ReportResult is called by a worker after it finishes executing a task.
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
}

// --- RegisterWorker messages (Stage 3: NEW) ---

message RegisterWorkerRequest {
  string worker_id = 1;
}

message RegisterWorkerResponse {
  bool ok = 1;
}

// --- GetTask messages ---

message GetTaskRequest {
  string worker_id = 1;
}

message GetTaskResponse {
  bool has_task = 1;
  string task_id = 2;
  string command = 3;
}

// --- ReportResult messages ---

message ReportResultRequest {
  string worker_id = 1;
  string task_id = 2;
  string output = 3;
  int32 exit_code = 4;
}

message ReportResultResponse {
  bool ok = 1;
}
